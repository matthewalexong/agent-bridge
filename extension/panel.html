<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chrome Agent Bridge</title>
    <link rel="stylesheet" href="panel.css">
  </head>
  <body>
    <header>
      <img src="icons/icon32.png" width="26" height="26" alt="">
      <div class="head-text">
        <h1>Agent Bridge</h1>
        <p id="status" class="status pending">Connecting to local bridge…</p>
      </div>
      <button id="clear" class="text-button" type="button" title="Clear the conversation">Clear</button>
    </header>

    <div class="session-bar">
      <label for="sessions">Session</label>
      <select id="sessions" aria-label="Choose a previous harness session">
        <option value="">New session</option>
      </select>
      <button id="refresh-sessions" class="icon-button" type="button" title="Refresh previous sessions" aria-label="Refresh previous sessions">↻</button>
      <button id="rename-session" class="icon-button" type="button" title="Rename selected session" aria-label="Rename selected session" disabled>✎</button>
      <button id="remove-session" class="icon-button danger" type="button" title="Remove selected session" aria-label="Remove selected session" disabled>×</button>
    </div>

    <main id="transcript" aria-live="polite" aria-label="Conversation">
      <p id="empty" class="empty">
        Type below. Your connected agent reads these messages and replies here.
      </p>
    </main>

    <form id="composer" autocomplete="off">
      <textarea
        id="input"
        rows="2"
        placeholder="Message the connected agent…"
        aria-label="Message the connected agent"
      ></textarea>
      <button id="send" class="primary" type="submit" disabled>Send</button>
    </form>

    <script type="module" src="panel.js"></script>
  </body>
</html>
