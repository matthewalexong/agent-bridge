name: Feature request
description: Propose a browser, harness, analysis, domain, or contributor-experience improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What outcome is difficult or impossible today? Avoid prescribing an implementation first.
    validations:
      required: true
  - type: dropdown
    id: lane
    attributes:
      label: Architectural lane
      options:
        - Neutral browser control
        - Harness integration and sessions
        - Analysis tools
        - Domain capability or evaluation
        - Installation and contributor experience
        - Not sure
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe a successful user-visible result and an example workflow.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What can users do today, and why is it insufficient?
  - type: textarea
    id: boundary
    attributes:
      label: Privacy, safety, and architecture considerations
      description: Note new permissions, browser data, consequential actions, model/provider coupling, or session ownership changes.
    validations:
      required: true
  - type: checkboxes
    id: neutrality
    attributes:
      label: Core-boundary confirmation
      options:
        - label: I considered whether this belongs in the neutral bridge, a harness adapter, or a domain capability.
          required: true
        - label: This proposal does not require publishing credentials or private browser data.
          required: true
