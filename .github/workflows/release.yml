name: Public beta release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          package-manager-cache: false
      - name: Verify tag and package versions
        run: node scripts/check-release-version.mjs "$GITHUB_REF_NAME"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit public repository history
        run: npm run audit:public
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run the complete test suite
        run: npm run check
      - name: Build the extension ZIP
        run: npm run build:extension
      - name: Write the release checksum
        run: |
          cd dist
          shasum -a 256 "chrome-agent-bridge-extension-v${GITHUB_REF_NAME#v}.zip" > SHA256SUMS.txt
      - name: Publish the developer beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/chrome-agent-bridge-extension-v${GITHUB_REF_NAME#v}.zip#Load-unpacked Chrome extension" \
            "dist/SHA256SUMS.txt#SHA-256 checksums" \
            --verify-tag \
            --prerelease \
            --notes-file docs/public-beta.md \
            --title "Agent Bridge ${GITHUB_REF_NAME}"
